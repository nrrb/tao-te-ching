name: Build book

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # HonKit output embeds file mtimes and a build timestamp, so it is not
      # byte-reproducible — this confirms the book still builds, it does not
      # diff against the committed docs/.
      - name: Build the book
        run: npx honkit build . build-check
